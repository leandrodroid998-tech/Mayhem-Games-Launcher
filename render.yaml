# Blueprint do Render — site estático (gratuito).
# Render > New > Blueprint > conecte o repositório. Ele lê este arquivo sozinho.
services:
  - type: web
    name: mayhem-games
    runtime: static
    buildCommand: echo "site estatico - nada para compilar"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: gamepad=(self), fullscreen=(self), autoplay=(self)
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*.js
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /*.css
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /games/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
